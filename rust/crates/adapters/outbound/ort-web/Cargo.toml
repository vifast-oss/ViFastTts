[package]
name = "vifasttts-ort-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ONNX Runtime Web backend for ViFastTts (wasm32 + JS callbacks)"

[lib]
name = "vifasttts_ort_web"
crate-type = ["rlib"]

[dependencies]
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
vifasttts-ports = { path = "../../../core/ports/backend" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
