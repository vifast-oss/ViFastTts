[package]
name = "vifasttts-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Terminal UI for ViFastTts (local ONNX or remote HTTP)"

[lib]
name = "vifasttts_tui"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm = "0.29"
ratatui = "0.30"
vifasttts-app = { path = "../../../core/application/app" }
vifasttts-http-client = { path = "../../outbound/http-client" }
vifasttts-huggingface = { path = "../../outbound/huggingface" }
vifasttts-model-manager = { path = "../../../core/application/model-manager" }
vifasttts-native = { path = "../native" }
vifasttts-text = { path = "../../../core/domain/text" }
