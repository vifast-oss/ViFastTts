[package]
name = "vifasttts-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Browser adapter: async engine + ORT Web backend + wasm helpers"

[lib]
name = "vifasttts_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde-wasm-bindgen = "0.6"
serde_json.workspace = true
js-sys = "0.3"
vifasttts-audio = { path = "../../../core/domain/audio" }
vifasttts-engine = { path = "../../../core/application/engine" }
vifasttts-ort-web = { path = "../../outbound/ort-web" }
vifasttts-text = { path = "../../../core/domain/text" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
