name: Fetch N0 model
description: Download the pinned N0 FP32 ONNX model from HuggingFace into artifacts/onnx/n0_q.

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: artifacts/onnx/n0_q
        key: n0-onnx-fp32-hf-v1
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p artifacts/onnx/n0_q
        if [ -f artifacts/onnx/n0_q/acoustic.onnx ] && [ -f artifacts/onnx/n0_q/vocoder.onnx ]; then
          echo "Model đã có trong cache/workspace."
          exit 0
        fi
        base="https://huggingface.co/dvchd/vifasttts-ngochuyen-small/resolve/main/onnx"
        curl -L --fail --retry 3 --retry-delay 2 -o artifacts/onnx/n0_q/acoustic.onnx \
          "$base/acoustic.onnx"
        curl -L --fail --retry 3 --retry-delay 2 -o artifacts/onnx/n0_q/vocoder.onnx \
          "$base/vocoder.onnx"
        printf '%s  artifacts/onnx/n0_q/acoustic.onnx\n%s  artifacts/onnx/n0_q/vocoder.onnx\n' \
          "df61599a15984dccbf61c37d616258d22fc1af79abc681926e74142de7a376a3" \
          "b3eb09cf5c3baac334b1c0bbea070d02e33e55572e3755865b986cd05cf6b03f" \
          | sha256sum -c -
        ls -lh artifacts/onnx/n0_q
