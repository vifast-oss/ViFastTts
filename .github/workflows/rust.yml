name: rust

on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml", "tools/rust_parity.py"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml", "tools/rust_parity.py"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: linux desktop deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: wasm core check
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p vifasttts-text -p vifasttts-audio -p vifasttts-ports -p vifasttts-engine -p vifasttts-app -p vifasttts-ort-web -p vifasttts-browser --target wasm32-unknown-unknown
          cargo clippy -p vifasttts-app -p vifasttts-ort-web -p vifasttts-browser --target wasm32-unknown-unknown -- -D warnings
