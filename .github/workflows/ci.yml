name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-on-failure: true
      - name: Linux desktop deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: wasm core check
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p vifasttts-text -p vifasttts-audio -p vifasttts-ports \
            -p vifasttts-engine -p vifasttts-app -p vifasttts-ort-web \
            -p vifasttts-browser --target wasm32-unknown-unknown
          cargo clippy -p vifasttts-app -p vifasttts-ort-web \
            -p vifasttts-browser --target wasm32-unknown-unknown -- -D warnings

  python-lint:
    name: python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install ruff
        run: pip install ruff
      - name: ruff
        run: ruff check .

  web-extension:
    name: web + extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/fetch-model
      - name: wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: build wasm + extension
        run: |
          chmod +x extension/build.sh web/build.sh
          ./extension/build.sh
          ./web/build.sh
          (cd web && npm run build)
      - name: package extension + web
        run: |
          cd extension
          zip -qr "$GITHUB_WORKSPACE/vifasttts-extension.zip" . -x "*/.*"
          tar -czf "$GITHUB_WORKSPACE/web-dist.tar.gz" -C "$GITHUB_WORKSPACE/web/dist" .
      - uses: actions/upload-artifact@v4
        with:
          name: web-extension
          path: |
            vifasttts-extension.zip
            web-dist.tar.gz
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.platform }})
    needs: web-extension
    # Chỉ đóng gói khi tag (hoặc chạy tay); push main/PR chỉ test.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            artifact: desktop/dist/vifasttts-desktop-macos-*.zip
          - os: ubuntu-latest
            platform: linux
            artifact: desktop/dist/vifasttts-desktop-linux-x64.tar.gz
          - os: windows-latest
            platform: windows
            artifact: desktop/dist/vifasttts-desktop-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-on-failure: true
      - uses: actions/cache@v4
        if: runner.os != 'macOS'
        with:
          path: desktop/dist/cache
          key: ort-1.31.1-${{ runner.os }}
      - name: Linux desktop deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev
      - uses: ./.github/actions/fetch-model
      - uses: actions/download-artifact@v4
        with:
          name: web-extension
          path: web-artifact
      - name: prepare web
        shell: bash
        run: |
          mkdir -p web-dist
          tar -xzf web-artifact/web-dist.tar.gz -C web-dist
      - name: package macOS
        if: runner.os == 'macOS'
        run: |
          WEB_DIR=web-dist rust/crates/adapters/inbound/desktop/package-macos.sh
          desktop/dist/ViFastTts.app/Contents/MacOS/vifasttts-desktop --smoke
      - name: package Linux
        if: runner.os == 'Linux'
        run: |
          WEB_DIR=web-dist rust/crates/adapters/inbound/desktop/package-linux.sh
          (cd desktop/dist/vifasttts-desktop-linux-x64 && ./vifasttts-desktop --smoke)
      - name: package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rust/crates/adapters/inbound/desktop/package-windows.ps1 -WebDir web-dist
          & desktop/dist/vifasttts-desktop-windows-x64/vifasttts-desktop.exe --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  cli:
    name: cli/tui/server (${{ matrix.platform }})
    needs: web-extension
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: desktop/dist/vifasttts-cli-linux-x64.tar.gz
          - os: macos-15
            platform: macos
            artifact: desktop/dist/vifasttts-cli-macos-*.tar.gz
          - os: windows-latest
            platform: windows
            artifact: desktop/dist/vifasttts-cli-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-on-failure: true
      - name: Linux desktop deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - uses: ./.github/actions/fetch-model
      - uses: actions/download-artifact@v4
        with:
          name: web-extension
          path: web-artifact
      - name: prepare web
        shell: bash
        run: |
          mkdir -p web-dist
          tar -xzf web-artifact/web-dist.tar.gz -C web-dist
      - name: package unix
        if: runner.os != 'Windows'
        run: |
          chmod +x server/package-unix.sh
          WEB_DIR=web-dist server/package-unix.sh
          cli_bin="$(find desktop/dist -path '*vifasttts-cli-*' -type d -name 'vifasttts-cli-*' | head -1)/vifasttts"
          "$cli_bin" --help >/dev/null
      - name: package windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          server/package-windows.ps1 -WebDir web-dist
          & desktop/dist/vifasttts-cli-windows-x64/vifasttts.exe --help | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  model-vfts:
    name: model .vfts
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-on-failure: true
      - uses: ./.github/actions/fetch-model
      - name: pack bundle
        run: |
          cargo build --release -p vifasttts-cli --manifest-path rust/Cargo.toml
          mkdir -p desktop/dist
          rust/target/release/vifasttts vfts pack \
            --output desktop/dist/n0-ngochuyen.vfts
          rust/target/release/vifasttts vfts inspect \
            desktop/dist/n0-ngochuyen.vfts >/dev/null
          rust/target/release/vifasttts vfa pack \
            --output desktop/dist/n0-ngochuyen.vfa \
            --vocoder artifacts/onnx/n0_q/vocoder.onnx
          rust/target/release/vifasttts vfa inspect \
            desktop/dist/n0-ngochuyen.vfa >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: model-vfts
          path: |
            desktop/dist/n0-ngochuyen.vfts
            desktop/dist/n0-ngochuyen.vfa
          if-no-files-found: error

  android:
    name: android apk
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          key: ndk-28.2.13676358
      - uses: actions/cache@v4
        with:
          path: artifacts/onnx/onnxruntime-android-1.31.1.aar
          key: ort-android-aar-1.31.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/fetch-model
      - name: android sdk + rust targets
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Không thấy sdkmanager trong runner image" >&2
            exit 2
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          if [ ! -d "$SDK/ndk/28.2.13676358" ]; then
            sdkmanager "ndk;28.2.13676358"
          fi
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup target add x86_64-linux-android aarch64-linux-android
      - name: build apk
        run: |
          chmod +x mobile/android/build.sh
          mobile/android/build.sh
      - name: rename apk
        run: |
          mkdir -p desktop/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk             desktop/dist/vifasttts-mobile-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: desktop/dist/vifasttts-mobile-android.apk
          if-no-files-found: error

  ios:
    name: ios simulator
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-on-failure: true
      - uses: ./.github/actions/fetch-model
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/vifasttts-ort-ios.zip
          key: ort-ios-1.30.0
      - name: Xcode tooling
        run: |
          xcodebuild -version
          brew install xcodegen
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
          ORT_ZIP="$HOME/Library/Caches/vifasttts-ort-ios.zip"
          if [ ! -f "$ORT_ZIP" ]; then
            curl -L --fail -o "$ORT_ZIP" \
              https://download.onnxruntime.ai/pod-archive-onnxruntime-c-1.30.0.zip
          fi
          unzip -q "$ORT_ZIP" -d /tmp/ort-ios
      - name: build simulator app
        run: |
          chmod +x mobile/ios/build-ios.sh
          ONNXRUNTIME_XCFRAMEWORK=/tmp/ort-ios/onnxruntime.xcframework \
            mobile/ios/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: mobile/ios/build/vifasttts-mobile-ios-simulator.zip
          if-no-files-found: error

  release:
    name: publish release
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android, web-extension, cli, ios, model-vfts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: show assets
        run: find release-assets -maxdepth 4 -type f -print
      - name: create/update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=$(find release-assets -type f -print)
          prerelease=""
          case "$tag" in
            *-rc*|*-test*) prerelease="--prerelease" ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $assets --clobber
          else
            gh release create "$tag" $assets --generate-notes $prerelease
          fi
