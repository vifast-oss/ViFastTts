<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViFastTts — local browser</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="./shared/theme.css" />
    <style>
      body { font-family: var(--vf-font); background: var(--vf-bg); color: var(--vf-ink); max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
      textarea, input, select { font-family: var(--vf-font); background: var(--vf-surface); color: var(--vf-ink); border: 1px solid var(--vf-border); border-radius: 8px; padding: .45rem .6rem; }
      textarea { width: 100%; min-height: 8rem; font: inherit; }
      button { padding: .5rem 1rem; font: inherit; border: 1px solid var(--vf-border); border-radius: 8px; color: var(--vf-ink); background: var(--vf-soft); cursor: pointer; }
      button.primary, #run { background: var(--vf-accent); color: #fff; border-color: var(--vf-accent); font-weight: 700; }
      button:hover { border-color: var(--vf-accent); }
      #status { white-space: pre-wrap; color: var(--vf-muted); }
      #karaoke { line-height: 1.8; font-size: 1.2rem; }
      #karaoke span { padding: .1rem .15rem; border-radius: .2rem; }
      #karaoke span.active { background: #ffe08a; }
      pre { background: var(--vf-surface); border: 1px solid var(--vf-border); border-radius: 8px; padding: 1rem; overflow: auto; }
    .hidden { display: none; }
    input, select { font: inherit; }
    #modelList, #modelFiles { max-height: 12rem; overflow: auto; }
    #modelList button, #modelFiles button { display: block; margin: .15rem 0; width: 100%; text-align: left; }
    </style>
  </head>
  <body>
    <header style="display:flex;align-items:center;gap:12px;margin-bottom:1rem">
      <img src="/icon-192.png" alt="" width="48" height="48" style="border-radius:12px" />
      <div>
        <h1 style="margin:0">ViFastTts</h1>
        <div style="color:var(--vf-muted);font-size:.9rem">Chạy local trong trình duyệt</div>
      </div>
    </header>
    <p id="status">Đang nạp wasm/model…</p>
    <textarea id="text">Xin chào các bạn, hôm nay trời đẹp.</textarea>
    <p>
      <label>Chế độ
        <select id="mode">
          <option value="local">Local WASM</option>
          <option value="remote">Remote server</option>
        </select>
      </label>
      <label><input type="checkbox" id="fixed" /> đọc đều (fixed pauses)</label>
      <label>Tốc độ <input id="speed" type="range" min="0.5" max="2.0" step="0.05" value="1" /> <span id="speedValue">1.00×</span></label>
    </p>
    <p id="remoteFields" class="hidden">
      <label>Server URL <input id="serverUrl" size="34" value="http://127.0.0.1:8000" /></label>
      <label>Token <input id="token" type="password" size="20" /></label>
    </p>
    <details id="modelBrowser">
      <summary>Thêm giọng từ HuggingFace (qua server)</summary>
      <p>
        <input id="modelQuery" value="vifasttts" />
        <button id="modelSearch" type="button">Tìm</button>
        <span id="modelStatus"></span>
      </p>
      <div id="modelList"></div>
      <div id="modelFiles"></div>
    </details>
    <p>
      <label>Nạp model .vfa/.vfts
        <input id="modelFile" type="file" accept=".vfa,.vfts" />
      </label>
    </p>
    <p><button id="run" class="primary">Đọc</button></p>
    <audio id="audio" controls></audio>
    <p><a id="download" class="hidden" download="vifasttts.wav" href="#">Tải WAV</a></p>
    <div id="karaoke"></div>
    <pre id="srt"></pre>
    <script type="module" src="/app.js"></script>
  </body>
</html>
