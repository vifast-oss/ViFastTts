name: ViFastTtsMobile
options:
  bundleIdPrefix: com.vifasttts
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  ViFastTtsMobile:
    type: application
    platform: iOS
    sources:
      - path: ViFastTtsMobile
    info:
      path: ViFastTtsMobile/Info.plist
      properties:
        CFBundleDisplayName: ViFastTts
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vifasttts.mobile
        SWIFT_OBJC_BRIDGING_HEADER: ViFastTtsMobile/ViFastTtsMobile-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/ViFastTtsFFI/lib"
        OTHER_LDFLAGS:
          - "-lvifasttts_ffi"
          - "-lonnxruntime"
        ENABLE_BITCODE: NO
    resources:
      - path: Resources
