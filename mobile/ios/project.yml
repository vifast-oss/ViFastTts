name: ViFastTtsMobile
options:
  bundleIdPrefix: com.vifasttts
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  ViFastTtsMobile:
    type: application
    platform: iOS
    sources:
      - path: ViFastTtsMobile
      - path: Resources
        buildPhase: resources
    info:
      path: ViFastTtsMobile/Info.plist
      properties:
        CFBundleDisplayName: ViFastTts
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: "ViFastTts cần kết nối tới server TTS trong mạng LAN."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - BeVietnamPro-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vifasttts.mobile
        SWIFT_OBJC_BRIDGING_HEADER: ViFastTtsMobile/ViFastTtsMobile-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/ViFastTtsFFI/lib"
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/ViFastTtsFFI/Frameworks"
        OTHER_LDFLAGS:
          - "-lvifasttts_ffi"
          - "-framework"
          - "onnxruntime"
          - "-framework"
          - "Network"
          - "-lc++"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
