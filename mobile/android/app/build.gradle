plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vifasttts.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vifasttts.mobile'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.2.0'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
}
